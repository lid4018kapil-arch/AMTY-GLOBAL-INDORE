<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGDVCSH4HR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZGDVCSH4HR');
    </script>

    <meta property="og:url" content="https://lid4018kapil-arch.github.io/AMTY-GLOBAL-INDORE/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AMTY Global Indore - Find Your Chair">
    <meta property="og:description" content="Get expert recommendation for the best massage chair in Indore.">
    <meta property="og:image" content="https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMTY Global - Indore</title>
    <style>
        :root { --primary-color: #003366; --accent-color: #d4af37; --bg-color: #f4f4f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-color); display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .header { text-align: center; padding: 15px 0; border-bottom: 2px solid var(--accent-color); margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--primary-color); font-size: 24px; }
        .card { display: none; text-align: center; animation: fadeIn 0.4s ease-in-out; }
        .card.active { display: block; }
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-call { background: var(--accent-color); color: black; }
        .product-card { border: 2px solid #eee; padding: 15px; border-radius: 12px; margin: 15px 0; text-align: left; background: #fff; }
        .reason-box { background: #fff8e1; border-left: 4px solid var(--accent-color); padding: 12px; margin-bottom: 15px; font-size: 15px; color: #333; line-height: 1.4; }
        .product-card img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .contact-footer { margin-top: auto; padding: 15px; border-top: 1px solid #ddd; font-size: 14px; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">
        <h1>AMTY GLOBAL</h1>
        <p style="font-weight: bold; color: var(--accent-color); margin: 5px 0;">Indore Branch</p>
    </div>

    <div id="step1" class="card active">
        <h2>Aapki Zaroorat Kya Hai?</h2>
        <p>Sahi chair chunne mein hum aapki madad karenge.</p>
        <button class="btn" onclick="nextStep('personal')">Ghar Ke Liye (Personal)</button>
        <button class="btn" onclick="nextStep('commercial')">Business Ke Liye (Commercial)</button>
    </div>

    <div id="step2" class="card">
        <h2 id="question-text">Category Chunein:</h2>
        <div id="options-container"></div>
    </div>

    <div id="step3" class="card">
        <h2 style="color: var(--accent-color);">Hamari Recommendation</h2>
        <div id="product-display"></div>
        
        <div style="background: #f0f4f8; padding: 15px; border-radius: 10px; margin-top: 10px;">
            <p style="font-weight: bold; margin-bottom: 10px;">Visit Kariye: 999 Khatiwala Tank, Indore</p>
            <a href="tel:+918319950609" class="btn btn-call">📞 Call Karein (Best Price Ke Liye)</a>
        </div>
        <button class="btn" onclick="location.reload()" style="background:#888; margin-top: 10px;">Wapas Shuru Karein</button>
    </div>

    <div class="contact-footer">
        <strong>Showroom:</strong> 999 Khatiwala Tank, Indore<br>
        <a href="tel:+918319950609" style="text-decoration:none; color: var(--primary-color); font-weight: bold;">+91 83199-50609</a>
    </div>
</div>

<script>
    const products = {
        'MonsterX': { name: "Monster X", reason: "Yeh hamari sabse advanced 7D chair hai. Agar aapko best-in-class full body therapy chahiye, toh Monster X se behtar kuch nahi.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/12/Monster-X-1.webp" },
        'Moonwalker': { name: "Moonwalker M", reason: "Isme independent leg movement hai, jo thake huye pairon ke liye bohot asardaar hai. Luxury aur comfort ka perfect combo.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/Moonwalker-M-1.webp" },
        'RX7': { name: "RX 7 Capsule", reason: "Space-saving design aur zero-gravity features ke sath, yeh chote kamron mein bhi fit ho jati hai aur deep massage deti hai.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/RX-7-1.webp" },
        'RXTwister': { name: "RX Twister", reason: "Special twisting aur stretching therapy ke liye. Agar aapko back pain ya stiffness rehti hai, toh yeh best hai.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-3-1.webp" },
        'RX5Elite': { name: "RX-5 Elite", reason: "Heavy-duty durability. Yeh chair lambe samay tak bina kisi problem ke chalti hai, daily family use ke liye best.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-5-Elite-1.webp" },
        'RX3': { name: "RX-3 7D", reason: "Kam budget mein 7D technology chahiye? RX-3 sabse value-for-money model hai Indore mein.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-3-1.webp" },
        'Q7-2': { name: "Q7 2.0", reason: "Touchscreen control aur modern features ke sath. Commercial use ke liye bhi bohot stylish dikhti hai.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-2.0-1.webp" },
        'R9': { name: "R9 7D", reason: "Human-touch rollers jo bilkul asli massage jaisa feel dete hain. Chronic pain ke liye best therapy.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R9-1.webp" },
        'R8Pro': { name: "R8 Pro", reason: "Budget model jo special focus leg aur calf recovery pe karta hai. Exercise ke baad ke liye best.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R8-Pro-1.webp" },
        'CoinChair': { name: "Coin Massage Chair", reason: "Business ke liye best! Salon, Mall ya Hospital mein lagaiye aur automatic income shuru karein.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png" }
    };

    function nextStep(choice) {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        const container = document.getElementById('options-container');
        const qText = document.getElementById('question-text');

        if(choice === 'personal') {
            qText.innerText = "Apna Budget/Style Chunein:";
            container.innerHTML = `
                <button class="btn" onclick="showBranch('luxury')">Luxury (Top Models)</button>
                <button class="btn" onclick="showBranch('value')">Value for Money</button>
                <button class="btn" onclick="showBranch('budget')">Low Budget</button>
            `;
        } else {
            qText.innerText = "Kahan Ke Liye Chahiye?";
            container.innerHTML = `
                <button class="btn" onclick="showFinal('R9')">Wellness/Spa</button>
                <button class="btn" onclick="showFinal('Q7-2')">Hotel/Office</button>
                <button class="btn" onclick="showFinal('CoinChair')">Public Place (Coin Operated)</button>
            `;
        }
    }

    function showBranch(type) {
        const container = document.getElementById('options-container');
        if(type === 'luxury') {
            container.innerHTML = `<button class="btn" onclick="showFinal('MonsterX')">Monster X</button><button class="btn" onclick="showFinal('Moonwalker')">Moonwalker</button><button class="btn" onclick="showFinal('RX7')">RX 7 Capsule</button>`;
        } else if(type === 'value') {
            container.innerHTML = `<button class="btn" onclick="showFinal('RX3')">RX-3 7D</button><button class="btn" onclick="showFinal('RX5Elite')">RX-5 Elite</button>`;
        } else if(type === 'budget') {
            container.innerHTML = `<button class="btn" onclick="showFinal('R8Pro')">R8 Pro</button><button class="btn" onclick="showFinal('RXTwister')">RX Twister</button>`;
        }
    }

    function showFinal(modelKey) {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        const item = products[modelKey];
        const waLink = `https://wa.me/918319950609?text=Hi, Indore Branch. I am interested in ${item.name}. Please share price and offer details.`;
        
        document.getElementById('product-display').innerHTML = `
            <div class="product-card">
                <h3>${item.name}</h3>
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png'">
                <div class="reason-box"><strong>Kyon Kharidein:</strong> ${item.reason}</div>
                <a href="${waLink}" class="btn btn-whatsapp">💬 Is Model Ke Liye Chat Karein</a>
            </div>
        `;
        gtag('event', 'view_item', { 'item_name': item.name });
    }
</script>
</body>
</html>
