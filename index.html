<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMTY Global - Indore Branch</title>
    <style>
        :root { --primary-color: #003366; --accent-color: #d4af37; --bg-color: #f4f4f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-color); display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--accent-color); margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--primary-color); font-size: 24px; }
        .card { display: none; text-align: center; animation: fadeIn 0.4s ease-in-out; }
        .card.active { display: block; }
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-call { background: var(--accent-color); color: #000; }
        .btn-whatsapp { background: #25D366; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: left; }
        .reason-box { background: #fff8e1; border-left: 4px solid var(--accent-color); padding: 10px; margin-bottom: 15px; font-size: 14px; color: #444; }
        .product-card img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .contact-footer { margin-top: auto; padding: 20px; border-top: 1px solid #ddd; font-size: 14px; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">
        <h1>AMTY GLOBAL</h1>
        <p style="font-weight: bold; color: var(--accent-color); margin: 5px 0;">Indore Branch</p>
    </div>

    <div id="step1" class="card active">
        <h2>Find Your Perfect Match</h2>
        <p>Explore our full range of 15 premium models.</p>
        <button class="btn" onclick="nextStep('personal')">For Personal Use</button>
        <button class="btn" onclick="nextStep('commercial')">For Commercial Use</button>
    </div>

    <div id="step2" class="card">
        <h2 id="question-text">Select your preference:</h2>
        <div id="options-container"></div>
    </div>

    <div id="step3" class="card">
        <h2 style="color: var(--accent-color);">Our Expert Recommendation</h2>
        <div id="product-display"></div>
        <div style="background: #f0f4f8; padding: 15px; border-radius: 10px; margin-top: 10px;">
            <p style="font-weight: bold;">Visit Khatiwala Tank for a Demo!</p>
            <a href="tel:+918319950609" class="btn btn-call">📞 Call Now for Price & Info</a>
        </div>
        <button class="btn" onclick="location.reload()" style="background:#888; margin-top: 15px;">Restart Quiz</button>
    </div>

    <div class="contact-footer">
        <strong>Showroom:</strong> 999 Khatiwala Tank, Indore<br>
        <a href="tel:+918319950609" style="text-decoration:none; color: var(--primary-color); font-weight: bold;">+91 83199-50609</a><br>
        <a href="https://wa.me/918319950609?text=Inquiry%20from%20Indore%20App" class="btn btn-whatsapp">💬 WhatsApp Chat</a>
    </div>
</div>

<script>
    const products = {
        'MonsterX': { name: "Monster X", reason: "The 7D Monster X is our flagship model for those in Indore seeking the absolute ultimate in luxury therapy.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/12/Monster-X-1.webp", link: "monster-x-massage-chair" },
        'R10': { name: "R10 4D", reason: "Perfect if you love AI and voice control. It features advanced body scanning for a precision massage.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R-10-1.webp", link: "r-10-massage-chair" },
        'R9': { name: "R9 7D", reason: "A top-tier 7D model that focuses on replicating the exact feel of human hands.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R9-1.webp", link: "r9-massage-chair" },
        'RX7': { name: "RX 7 Capsule", reason: "Futuristic capsule design for those who want a completely immersive, zero-gravity experience.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/RX-7-1.webp", link: "rx-7-massage-capsule" },
        'Moonwalker': { name: "Moonwalker M", reason: "Unique individual leg movement technology. It's unlike any other chair in the 15-model range.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/Moonwalker-M-1.webp", link: "moonwalker-m-capsule" },
        'R8Pro': { name: "R8 Pro", reason: "Great for athletes or active users, featuring enhanced thigh and calf massage zones.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R8-Pro-1.webp", link: "r8-pro-massage-chair" },
        'R7Neo': { name: "R7 Neo", reason: "A stylish, metal-framed 4D chair that looks as good in an Indore living room as it feels.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R7-Neo-1.webp", link: "r7-neo-massage-chair" },
        'R6': { name: "R6 4D", reason: "Combines the warmth of a wooden frame with powerful 4D relief mechanisms.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R6-1.webp", link: "r6-massage-chair" },
        'Q7-2': { name: "Q7 2.0", reason: "Interactive tech at its best. Control your entertainment while enjoying a full-body massage.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-2.0-1.webp", link: "q7-2-0-massage-chair" },
        'RX5Elite': { name: "RX-5 Elite", reason: "The commercial workhorse. Designed for heavy use in Indore's gyms and wellness centers.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-5-Elite-1.webp", link: "rx-5-elite-massage-chair" },
        'RX3': { name: "RX-3 7D", reason: "Dual SL track system that covers from neck to under-thigh with 7D precision.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-3-1.webp", link: "rx-3-massage-chair" },
        'Q7': { name: "Q7 Model", reason: "Our most popular budget-friendly full-body chair. Efficient and effective.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-1.webp", link: "q7-massage-chair" },
        'BackPain': { name: "Chronic Back Pain Model", reason: "Specifically engineered for users suffering from persistent spinal and lumbar discomfort.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Back-Pain-1.webp", link: "massage-chair-for-chronic-back-pain" },
        'Compact': { name: "Compact Portable", reason: "Perfect for Indore apartments where space is a priority without losing quality.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Compact-1.webp", link: "compact-portable-massage-chair" },
        'R5': { name: "R5 Model", reason: "Reliable SL-Track performance for consistent daily stress relief.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png", link: "r-5-massage-chair" }
    };

    function nextStep(choice) {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        const container = document.getElementById('options-container');
        const qText = document.getElementById('question-text');

        if(choice === 'personal') {
            qText.innerText = "What is your main goal?";
            container.innerHTML = `
                <button class="btn" onclick="showBranch('luxury')">Ultra Luxury & 7D</button>
                <button class="btn" onclick="showBranch('tech')">Smart Tech & AI</button>
                <button class="btn" onclick="showBranch('health')">Medical & Back Pain</button>
                <button class="btn" onclick="showBranch('budget')">Value & Compact</button>
            `;
        } else {
            qText.innerText = "Commercial Type:";
            container.innerHTML = `
                <button class="btn" onclick="showFinal('RX5Elite')">Gym / Clinic (Heavy Duty)</button>
                <button class="btn" onclick="showFinal('Q7-2')">Hotel / Office Lounge</button>
                <button class="btn" onclick="showFinal('R6')">Wellness Center (Wooden)</button>
            `;
        }
    }

    function showBranch(type) {
        const container = document.getElementById('options-container');
        if(type === 'luxury') {
            container.innerHTML = `
                <button class="btn" onclick="showFinal('MonsterX')">Monster X (Ultimate)</button>
                <button class="btn" onclick="showFinal('R9')">R9 (Human Touch)</button>
                <button class="btn" onclick="showBranch('capsule')">View Capsule Models</button>
            `;
        } else if(type === 'capsule') {
            container.innerHTML = `
                <button class="btn" onclick="showFinal('RX7')">RX 7 Capsule</button>
                <button class="btn" onclick="showFinal('Moonwalker')">Moonwalker M</button>
            `;
        } else if(type === 'tech') {
            container.innerHTML = `
                <button class="btn" onclick="showFinal('R10')">R10 (AI Scan)</button>
                <button class="btn" onclick="showFinal('RX3')">RX-3 (Dual SL Track)</button>
                <button class="btn" onclick="showFinal('R7Neo')">R7 Neo (Sleek Metal)</button>
            `;
        } else if(type === 'health') {
            container.innerHTML = `
                <button class="btn" onclick="showFinal('BackPain')">Chronic Back Pain Model</button>
                <button class="btn" onclick="showFinal('R8Pro')">R8 Pro (Leg Recovery)</button>
            `;
        } else if(type === 'budget') {
            container.innerHTML = `
                <button class="btn" onclick="showFinal('Q7')">Q7 Model (Value)</button>
                <button class="btn" onclick="showFinal('Compact')">Compact Portable</button>
                <button class="btn" onclick="showFinal('R5')">R5 Series</button>
            `;
        }
    }

    function showFinal(modelKey) {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        const item = products[modelKey];
        document.getElementById('product-display').innerHTML = `
            <div class="product-card">
                <div class="reason-box"><strong>Why this fits you:</strong> ${item.reason}</div>
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png'">
                <h3>${item.name}</h3>
                <a href="https://www.amtyglobal.com/products/${item.link}" target="_blank" style="color: var(--primary-color); font-weight: bold;">Official Product Specs →</a>
            </div>
        `;
    }
</script>
</body>
</html>
