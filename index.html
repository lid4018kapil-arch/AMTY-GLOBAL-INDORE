<!DOCTYPE html>
<html lang="en">
<head>

    <meta property="og:url" content="https://lid4018kapil-arch.github.io/AMTY-GLOBAL-INDORE/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AMTY Global - Indore Massage Chair Selector">
    <meta property="og:description" content="Find the perfect massage chair in Indore. 15+ models available at Khatiwala Tank showroom.">
    <meta property="og:image" content="https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png">
    <meta property="og:image:width" content="1200">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMTY Global - Indore Branch</title>
    <style>
        :root { --primary-color: #003366; --accent-color: #d4af37; --bg-color: #f4f4f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-color); display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 500px; background: white; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--accent-color); margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--primary-color); font-size: 24px; }
        .card { display: none; text-align: center; animation: fadeIn 0.4s ease-in-out; }
        .card.active { display: block; }
        .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-call { background: var(--accent-color); color: #000; }
        .btn-whatsapp { background: #25D366; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: left; }
        .reason-box { background: #fff8e1; border-left: 4px solid var(--accent-color); padding: 10px; margin-bottom: 15px; font-size: 14px; color: #444; }
        .product-card img { width: 100%; border-radius: 8px; margin-bottom: 10px; background: #eee; }
        .contact-footer { margin-top: auto; padding: 20px; border-top: 1px solid #ddd; font-size: 14px; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">
        <h1>AMTY GLOBAL</h1>
        <p style="font-weight: bold; color: var(--accent-color); margin: 5px 0;">Indore Branch</p>
    </div>

    <div id="step1" class="card active">
        <h2>Find Your Perfect Match</h2>
        <p>Expertly categorized massage chairs for your home or business.</p>
        <button class="btn" onclick="nextStep('personal')">For Personal Use</button>
        <button class="btn" onclick="nextStep('commercial')">For Commercial Use</button>
    </div>

    <div id="step2" class="card">
        <h2 id="question-text">Select Category:</h2>
        <div id="options-container"></div>
    </div>

    <div id="step3" class="card">
        <h2 style="color: var(--accent-color);">Our Recommendation</h2>
        <div id="product-display"></div>
        <div style="background: #f0f4f8; padding: 15px; border-radius: 10px; margin-top: 10px;">
            <p style="font-weight: bold; margin: 0 0 10px 0;">Visit 999 Khatiwala Tank for a Demo!</p>
            <a href="tel:+918319950609" onclick="gtag('event', 'click_call', {'branch': 'Indore'});" class="btn btn-call">📞 Call Now for Price & Info</a>
        </div>
        <button class="btn" onclick="location.reload()" style="background:#888; margin-top: 15px;">Restart Quiz</button>
    </div>

    <div class="contact-footer">
        <strong>Showroom:</strong> 999 Khatiwala Tank, Indore<br>
        <a href="tel:+918319950609" style="text-decoration:none; color: var(--primary-color); font-weight: bold;">+91 83199-50609</a><br>
        <a href="https://wa.me/918319950609?text=Inquiry%20from%20Indore%20App" onclick="gtag('event', 'click_whatsapp', {'branch': 'Indore'});" class="btn btn-whatsapp">💬 WhatsApp Chat</a>
    </div>
</div>

<script>
    const products = {
        'MonsterX': { name: "Monster X", reason: "Luxury 7D flagship for ultimate therapy.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/12/Monster-X-1.webp", link: "monster-x-massage-chair" },
        'Moonwalker': { name: "Moonwalker M", reason: "Premium capsule with independent leg movement.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/Moonwalker-M-1.webp", link: "moonwalker-m-capsule" },
        'RX7': { name: "RX 7 Capsule", reason: "Futuristic zero-gravity experience.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/11/RX-7-1.webp", link: "rx-7-massage-capsule" },
        'RXTwister': { name: "Rx Twister", reason: "Advanced luxury model specializing in twisting and stretching relief.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-3-1.webp", link: "rx-twister-massage-chair" },
        'RX5Elite': { name: "RX-5 Elite", reason: "Top durability for high-end home use.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-5-Elite-1.webp", link: "rx-5-elite-massage-chair" },
        'RX3': { name: "RX-3 7D", reason: "Best 7D value with Dual SL track.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/RX-3-1.webp", link: "rx-3-massage-chair" },
        'Q9Sonic': { name: "Q9 Sonic", reason: "Advanced sonic-vibration technology for deeper muscle relief.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-2.0-1.webp", link: "q9-sonic-massage-chair" },
        'Q7-2': { name: "Q7 2.0", reason: "Touchscreen and interactive app control.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-2.0-1.webp", link: "q7-2-0-massage-chair" },
        'R10': { name: "R10 4D", reason: "AI scanning and voice command tech.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R-10-1.webp", link: "r-10-massage-chair" },
        'R9': { name: "R9 7D", reason: "Human-touch rollers for therapeutic needs.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R9-1.webp", link: "r9-massage-chair" },
        'Q5': { name: "Q5 Model", reason: "Balanced robotics and full body coverage.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/Q7-1.webp", link: "q5-massage-chair" },
        'R8Pro': { name: "R8 Pro", reason: "Budget focus on leg and calf recovery.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R8-Pro-1.webp", link: "r8-pro-massage-chair" },
        'R7Neo': { name: "R7 Neo", reason: "Stylish metal frame 4D relief.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R7-Neo-1.webp", link: "r7-neo-massage-chair" },
        'R6': { name: "R6 4D", reason: "Elegant wooden frame 4D chair.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/07/R6-1.webp", link: "r6-massage-chair" },
        'CoinChair': { name: "Coin Massage Chair", reason: "Automatic revenue generator for public spaces.", img: "https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png", link: "coin-massage-chair" }
    };

    function nextStep(choice) {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        const container = document.getElementById('options-container');
        const qText = document.getElementById('question-text');

        if(choice === 'personal') {
            qText.innerText = "Select Personal Category:";
            container.innerHTML = `
                <button class="btn" onclick="showBranch('luxury')">Luxury Models</button>
                <button class="btn" onclick="showBranch('value')">Value Models</button>
                <button class="btn" onclick="showBranch('budget')">Budget Models</button>
            `;
        } else {
            qText.innerText = "Select Commercial Setting:";
            container.innerHTML = `
                <button class="btn" onclick="showBranch('wellness')">Wellness or Spa</button>
                <button class="btn" onclick="showBranch('therapy')">Saloon / Therapy / Mall</button>
                <button class="btn" onclick="showFinal('CoinChair')">Public Places</button>
            `;
        }
    }

    function showBranch(type) {
        const container = document.getElementById('options-container');
        if(type === 'luxury') {
            container.innerHTML = `<button class="btn" onclick="showFinal('MonsterX')">Monster X</button><button class="btn" onclick="showFinal('Moonwalker')">Moonwalker</button><button class="btn" onclick="showFinal('RX7')">RX 7 Capsule</button><button class="btn" onclick="showFinal('RXTwister')">Rx Twister</button><button class="btn" onclick="showFinal('RX5Elite')">RX-5 Elite</button>`;
        } else if(type === 'value') {
            container.innerHTML = `<button class="btn" onclick="showFinal('RX3')">RX-3</button><button class="btn" onclick="showFinal('Q9Sonic')">Q9 Sonic</button><button class="btn" onclick="showFinal('Q7-2')">Q7 2.0</button><button class="btn" onclick="showFinal('R10')">R10</button><button class="btn" onclick="showFinal('R9')">R9</button><button class="btn" onclick="showFinal('Q5')">Q5</button>`;
        } else if(type === 'budget') {
            container.innerHTML = `<button class="btn" onclick="showFinal('R8Pro')">R8 Pro</button><button class="btn" onclick="showFinal('R7Neo')">R7 Neo</button><button class="btn" onclick="showFinal('R6')">R6</button>`;
        } else if(type === 'wellness') {
            container.innerHTML = `<button class="btn" onclick="showFinal('R9')">R9</button><button class="btn" onclick="showFinal('Q7-2')">Q7 2.0</button><button class="btn" onclick="showFinal('CoinChair')">Coin Chair</button>`;
        } else if(type === 'therapy') {
            container.innerHTML = `<button class="btn" onclick="showFinal('R7Neo')">R7 Neo</button><button class="btn" onclick="showFinal('R9')">R9</button><button class="btn" onclick="showFinal('CoinChair')">Coin Chair</button><button class="btn" onclick="showFinal('Q7-2')">Q7 2.0</button>`;
        }
    }

    function showFinal(modelKey) {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step3').classList.add('active');
        const item = products[modelKey];
        document.getElementById('product-display').innerHTML = `
            <div class="product-card">
                <div class="reason-box"><strong>Why this fits:</strong> ${item.reason}</div>
                <img src="${item.img}" alt="${item.name}" onerror="this.src='https://www.amtyglobal.com/wp-content/uploads/2023/08/Amty-Global-Logo.png'">
                <h3>${item.name}</h3>
                <a href="https://www.amtyglobal.com/products/${item.link}" target="_blank" style="color: var(--primary-color); font-weight: bold;">Full Specs →</a>
            </div>
        `;
        gtag('event', 'view_item', { 'item_name': item.name });
    }
</script>
</body>
</html>
